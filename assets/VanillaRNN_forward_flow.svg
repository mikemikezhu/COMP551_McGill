<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1350" viewBox="0 50 1500 1350" role="img" aria-labelledby="rnn-title rnn-description">
<title id="rnn-title">Vanilla RNN forward pass</title>
<desc id="rnn-description">Input x passes through an embedding layer to make embedded word vectors. An embedded vector is extracted for each time step. RNN cells combine the current vector through W_ih with the previous hidden state through W_hh, apply tanh, and pass the final state through a fully connected layer to produce one raw logit per sample. In the row-vector notation shown, W_ih is E by H, W_hh is H by H, and each hidden state is B by H.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b88"/></marker></defs>
<rect width="1500" height="1400" fill="#ffffff"/>
<rect x="60" y="95" width="280" height="145" rx="13" fill="#f3f7fd" stroke="#afc3da" stroke-width="2"/>
<text x="200" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#244b7b">Input</text>
<text x="200" y="181" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#18253d">x</text>
<text x="200" y="218" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#5c718b">(B, T)</text>
<rect x="390" y="95" width="320" height="145" rx="13" fill="#e9f5f3" stroke="#9ccfc8" stroke-width="2"/>
<text x="550" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#13655f">Embedding layer</text>
<text x="550" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#45615e">Maps word IDs to dense vectors</text>
<text x="550" y="198" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#18253d">self.embedding(x)</text>
<text x="550" y="226" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#5c718b">(B, T) → (B, T, E)</text>
<rect x="760" y="95" width="680" height="145" rx="13" fill="#f3f7fd" stroke="#afc3da" stroke-width="2"/>
<text x="1100" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#244b7b">Word embeddings</text>
<text x="1100" y="184" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="27" font-weight="700" fill="#18253d">embedded</text>
<text x="1100" y="218" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#5c718b">(B, T, E)</text>
<path d="M 340 168 H 383" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 710 168 H 753" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1100 240 V 270 H 750 V 318" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g transform="translate(0 40)">
<rect x="450" y="285" width="600" height="105" rx="13" fill="#ffffff" stroke="#a9bfda" stroke-width="2"/>
<text x="750" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#244b7b">Embedded input at time t</text>
<text x="750" y="350" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#18253d">x_t = embedded[:, t, :]</text>
<text x="750" y="379" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#5c718b">(B, T, E) → (B, E)</text>
</g>
<g transform="translate(0 80)">
<rect x="60" y="420" width="1380" height="470" rx="14" fill="#f8fafc" stroke="#b7c7d8" stroke-width="2"/>
<text x="90" y="458" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#244b7b">RNN</text>
<path d="M 750 350 V 500 M 350 500 H 1060" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="500" r="4" fill="#526b88"/>
<path d="M 350 500 V 543" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="1060" cy="500" r="4" fill="#526b88"/>
<path d="M 1060 500 V 543" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="285" y="550" width="130" height="60" rx="10" fill="#ffffff" stroke="#a9bfda" stroke-width="1.7"/>
<text x="350" y="576" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#244b7b">x_1</text>
<text x="350" y="600" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#62738b">(B, E)</text>
<path d="M 350 610 V 652" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="381" y="641" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#c62828">W_ih</text>
<text x="381" y="657" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c62828">(E, H)</text>
<rect x="995" y="550" width="130" height="60" rx="10" fill="#ffffff" stroke="#a9bfda" stroke-width="1.7"/>
<text x="1060" y="576" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#244b7b">x_T</text>
<text x="1060" y="600" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#62738b">(B, E)</text>
<path d="M 1060 610 V 652" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1091" y="641" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#c62828">W_ih</text>
<text x="1091" y="657" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c62828">(E, H)</text>
<text x="705" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#62738b">...</text>
<rect x="75" y="670" width="80" height="70" rx="9" fill="#eef4fc" stroke="#9eb4cc" stroke-width="1.7"/>
<text x="115" y="700" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#244b7b">h_0</text>
<text x="115" y="727" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5c718b">(B, H)</text>
<rect x="260" y="660" width="180" height="90" rx="12" fill="#e9f5f3" stroke="#8fc8c0" stroke-width="2"/>
<text x="350" y="711" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#13655f">RNN cell</text>
<rect x="970" y="660" width="180" height="90" rx="12" fill="#e9f5f3" stroke="#8fc8c0" stroke-width="2"/>
<text x="1060" y="711" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#13655f">RNN cell</text>
<rect x="555" y="670" width="80" height="70" rx="9" fill="#eef4fc" stroke="#9eb4cc" stroke-width="1.7"/>
<text x="595.0" y="700" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#244b7b">h_1</text>
<text x="595.0" y="727" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5c718b">(B, H)</text>
<rect x="760" y="670" width="120" height="70" rx="9" fill="#eef4fc" stroke="#9eb4cc" stroke-width="1.7"/>
<text x="820.0" y="700" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#244b7b">h_(T-1)</text>
<text x="820.0" y="727" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5c718b">(B, H)</text>
<rect x="1260" y="670" width="90" height="70" rx="9" fill="#eef4fc" stroke="#9eb4cc" stroke-width="1.7"/>
<text x="1305.0" y="700" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#244b7b">h_T</text>
<text x="1305.0" y="727" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5c718b">(B, H)</text>
<path d="M 155 705 H 252" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 440 705 H 547" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 635 705 H 670" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 730 705 H 752" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 880 705 H 962" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1150 705 H 1252" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="205" y="668" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#c62828">W_hh</text>
<text x="205" y="692" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c62828">(H, H)</text>
<text x="925" y="668" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#c62828">W_hh</text>
<text x="925" y="692" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c62828">(H, H)</text>
<text x="493" y="686" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#8b4c75">tanh</text>
<text x="1205" y="686" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#8b4c75">tanh</text>
<text x="700" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#62738b">...</text>
<rect x="190" y="800" width="975" height="60" rx="9" fill="#ffffff" stroke="#c8d5e3" stroke-width="1.5"/>
<text x="677.5" y="838" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" xml:space="preserve"><tspan fill="#244b7b">h_t</tspan><tspan fill="#18253d"> = </tspan><tspan fill="#8b4c75">tanh</tspan><tspan fill="#18253d">(</tspan><tspan fill="#244b7b">x_t</tspan><tspan fill="#18253d"> </tspan><tspan fill="#c62828">W_ih</tspan><tspan fill="#18253d"> + </tspan><tspan fill="#244b7b">h_(t-1)</tspan><tspan fill="#18253d"> </tspan><tspan fill="#c62828">W_hh</tspan><tspan fill="#18253d">)</tspan></text>
</g>
<g transform="translate(0 150)">
<path d="M 1305 660 V 850 H 750 V 923" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="617.5" y="930" width="265" height="95" rx="13" fill="#f5eaf3" stroke="#d6aacd" stroke-width="2"/>
<text x="750" y="965" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7a3d70">Fully connected</text>
<text x="750" y="995" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#18253d">self.fc(h_T)</text>
<text x="750" y="1018" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#6f5d73">(B, H) → (B, 1)</text>
</g>
<g transform="translate(0 170)">
<text x="712" y="1033" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#5c718b">squeeze(1)</text>
<path d="M 750 1005 V 1053" fill="none" stroke="#526b88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="617.5" y="1060" width="265" height="140" rx="13" fill="#f3f7fd" stroke="#afc3da" stroke-width="2"/>
<text x="750" y="1098" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#244b7b">Output</text>
<text x="750" y="1146" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#18253d">y</text>
<text x="750" y="1183" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#5c718b">(B,)</text>
</g>
<g transform="translate(0 150)">
<text x="75" y="965" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62738b">B: batch size</text>
<text x="75" y="995" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62738b">T: sequence length</text>
<text x="75" y="1025" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62738b">E: embedding dimension</text>
<text x="75" y="1055" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62738b">H: hidden dimension</text>
</g>
</svg>
